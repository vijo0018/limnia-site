name = "limnia-keys"
main = "src/index.ts"
# Ed25519 in Web Crypto needs a reasonably recent compatibility date; do not
# move this backwards or key minting stops working.
compatibility_date = "2026-08-01"

[vars]
# Variant id of the Limnia Pro product (Products -> ... -> Copy variant ID).
# Not a secret.
#
# TEST MODE value. Lemon Squeezy keeps test and live data separate, so the
# live product created via "Copy to Live Mode" gets a DIFFERENT variant id.
# Update this before taking real payments, or every live order will fail
# authorization and no buyer will be able to claim a key.
LS_VARIANT_ID = "1993942"

# Origins allowed to call /key from a browser, comma separated. The localhost
# entry is what lets the claim flow be tested end to end against the real
# worker before the site is deployed; harmless in production because an origin
# only matters when a browser is enforcing it.
ALLOWED_ORIGIN = "https://vijo0018.github.io,http://localhost:4321"

# Secrets are NOT declared here. Set them once with:
#   wrangler secret put SIGNING_SEED_HEX     # 32-byte Ed25519 seed, hex
#   wrangler secret put LS_API_KEY
#   wrangler secret put LS_WEBHOOK_SECRET
