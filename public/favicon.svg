<?xml version="1.0" encoding="UTF-8"?>
<!--
  Reduced Limnia mark for the browser tab. The full icon.svg has three rings;
  at 16px they merge into mud, so the favicon keeps a single almost-closed ring
  plus the bright center. Same brand, legible small. Nav still uses icon.svg.
-->
<svg viewBox="0 0 256 256" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Limnia">
  <defs>
    <linearGradient id="fbg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2c2c30"/>
      <stop offset="100%" stop-color="#1a1a1c"/>
    </linearGradient>
    <linearGradient id="fripple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e9bff"/>
      <stop offset="100%" stop-color="#60cbff"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#fbg)"/>
  <circle cx="128" cy="128" r="72" fill="none" stroke="url(#fripple)" stroke-width="16"
          stroke-linecap="round" stroke-dasharray="405 48" transform="rotate(-58 128 128)"/>
  <circle cx="128" cy="128" r="26" fill="url(#fripple)"/>
</svg>
