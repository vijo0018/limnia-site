<?xml version="1.0" encoding="UTF-8"?>
<!--
  Open Graph image for Limnia. 1200x630 (Facebook/Twitter/LinkedIn/Discord).
  Referenced from <meta property="og:image"> in Layout.astro.

  Brand mark is the "Still ripple" (see icon.svg).

  This SVG is the SOURCE, not the shipped asset. Social crawlers (X, LinkedIn,
  Facebook, Slack, Discord) do not render SVG previews, so Layout.astro points
  og:image at public/og.png instead. After editing this file, regenerate it:
    bun run og

  Fonts use system fallbacks so SVG rasterizers render reliably across platforms.
-->
<svg width="1200" height="630" viewBox="0 0 1200 630"
     xmlns="http://www.w3.org/2000/svg"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, system-ui, sans-serif">
  <defs>
    <radialGradient id="bg" cx="40%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#1d1d20"/>
      <stop offset="55%" stop-color="#131316"/>
      <stop offset="100%" stop-color="#0c0c0e"/>
    </radialGradient>

    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#26262a"/>
    </pattern>

    <linearGradient id="ripple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e9bff"/>
      <stop offset="100%" stop-color="#60cbff"/>
    </linearGradient>

    <filter id="penGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <!-- Background: warm-tinted dark + subtle dot grid -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.55"/>

  <!-- Hero mark: a large still-pool ripple on the right, gaps to the upper-right -->
  <g transform="translate(985, 250)" fill="none" stroke="url(#ripple)"
     stroke-linecap="round" filter="url(#penGlow)">
    <circle r="135" stroke-width="7"  opacity="0.14" stroke-dasharray="773 75" transform="rotate(-70)"/>
    <circle r="100" stroke-width="9"  opacity="0.30" stroke-dasharray="573 55" transform="rotate(-58)"/>
    <circle r="66"  stroke-width="12" opacity="0.55" stroke-dasharray="379 36" transform="rotate(-64)"/>
    <circle r="34"  stroke-width="13" opacity="0.9"  stroke-dasharray="186 28" transform="rotate(-60)"/>
  </g>
  <circle cx="985" cy="250" r="18" fill="#5ec2ff" filter="url(#penGlow)"/>
  <circle cx="985" cy="250" r="16" fill="url(#ripple)"/>

  <!-- Top-left: brand mark + version stamp -->
  <g transform="translate(72, 64)">
    <rect width="40" height="40" rx="9" fill="#1d1d20"/>
    <!-- Mini ripple (lifted from favicon.svg) -->
    <circle cx="20" cy="20" r="12.5" fill="none" stroke="url(#ripple)" stroke-width="3.4"
            stroke-linecap="round" stroke-dasharray="70 8.5" transform="rotate(-58 20 20)"/>
    <circle cx="20" cy="20" r="4.6" fill="url(#ripple)"/>
    <text x="58" y="27" font-size="22" font-weight="700" fill="#eeeeee" letter-spacing="-0.3">
      Limnia
    </text>
    <text x="170" y="25" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
          font-size="12" letter-spacing="2.4" fill="#5a5a60">
      V1.1.0 / STABLE
    </text>
  </g>

  <!-- Headline — poster scale -->
  <g fill="#f3f3f5" font-weight="700" letter-spacing="-5">
    <text x="72" y="320" font-size="128">Draw on</text>
    <text x="72" y="448" font-size="128">your screen.</text>
  </g>

  <!-- Hand-drawn cyan underline beneath headline (with glow) -->
  <g>
    <path d="M 75 478 Q 240 498, 410 482 Q 545 470, 685 492"
          stroke="#32b4ff" stroke-width="9" stroke-linecap="round"
          fill="none" filter="url(#penGlow)" opacity="0.45"/>
    <path d="M 75 478 Q 240 498, 410 482 Q 545 470, 685 492"
          stroke="#32b4ff" stroke-width="5" stroke-linecap="round"
          fill="none"/>
  </g>

  <!-- Bottom-left: metadata strip -->
  <g transform="translate(72, 570)"
     font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
     font-size="13" letter-spacing="2.2" fill="#76767c">
    <circle cx="5" cy="-4" r="3.5" fill="#32b4ff"/>
    <text x="20" y="0">PURE WIN32</text>
    <text x="172" y="0">·</text>
    <text x="200" y="0">MADE IN RUST</text>
    <text x="356" y="0">·</text>
    <text x="382" y="0">~2 MB</text>
    <text x="466" y="0">·</text>
    <text x="492" y="0">NO TELEMETRY</text>
  </g>
  <text transform="translate(1128, 570)"
        font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace"
        font-size="13" letter-spacing="2.2" fill="#eeeeee" text-anchor="end">
    $0 · FOREVER FREE
  </text>
</svg>
